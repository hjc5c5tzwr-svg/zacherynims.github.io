<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buc-ee the Christmas Beaver — Read Online</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D1B2A;--sand:#C8A96E;--cream:#F0EBE1;--dark:#07111C;--red:#C8102E;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top,#16283a 0%,var(--dark) 70%);
    color:var(--cream);font-family:'Lato',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:0.9rem 1.5rem;background:rgba(7,17,28,0.9);
    border-bottom:1px solid rgba(200,169,110,0.2);
    position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);
  }
  header h1{
    font-family:'Playfair Display',serif;font-size:1.05rem;
    color:var(--sand);font-weight:700;letter-spacing:0.02em;
  }
  .back-link{
    color:var(--cream);text-decoration:none;font-size:0.78rem;
    letter-spacing:0.1em;text-transform:uppercase;opacity:0.7;
  }
  .back-link:hover{opacity:1;color:var(--sand);}
  .dl-btn{
    background:var(--sand);color:var(--dark);text-decoration:none;
    padding:0.4rem 1rem;font-size:0.72rem;letter-spacing:0.1em;
    text-transform:uppercase;font-weight:700;border-radius:3px;
  }
  .dl-btn:hover{background:var(--cream);}

  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:1.5rem;position:relative;gap:1rem;
  }
  .page-wrap{
    max-width:min(95vw,1100px);max-height:78vh;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    border-radius:4px;overflow:hidden;background:#fff;
    transition:opacity 0.18s ease;
  }
  .page-wrap img{display:block;width:100%;height:100%;object-fit:contain;max-height:78vh;}
  .nav-btn{
    background:rgba(200,169,110,0.15);border:1px solid rgba(200,169,110,0.4);
    color:var(--sand);width:52px;height:52px;border-radius:50%;
    font-size:1.6rem;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.2s,transform 0.1s;user-select:none;
  }
  .nav-btn:hover{background:rgba(200,169,110,0.3);}
  .nav-btn:active{transform:scale(0.92);}
  .nav-btn:disabled{opacity:0.25;cursor:default;}

  footer{
    padding:1rem 1.5rem 1.5rem;text-align:center;
  }
  .counter{font-size:0.8rem;letter-spacing:0.15em;color:rgba(240,235,225,0.6);margin-bottom:0.7rem;text-transform:uppercase;}
  .progress{
    max-width:420px;margin:0 auto;height:4px;border-radius:2px;
    background:rgba(255,255,255,0.1);overflow:hidden;
  }
  .progress-bar{height:100%;background:var(--sand);width:0%;transition:width 0.25s ease;}
  .hint{font-size:0.7rem;color:rgba(240,235,225,0.35);margin-top:0.8rem;}

  @media (max-width:768px){
    header h1{font-size:0.85rem;}
    .back-link{display:none;}
    .stage{padding:0.8rem;gap:0.4rem;}
    .nav-btn{width:42px;height:42px;font-size:1.3rem;}
    .page-wrap,.page-wrap img{max-height:68vh;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">← Back to site</a>
  <h1>🦫 Buc-ee the Christmas Beaver</h1>
  <a href="BUC-EE_THE_CHRISTMAS_BEAVER.pdf" download class="dl-btn">Download PDF</a>
</header>

<div class="stage">
  <button class="nav-btn" id="prev" aria-label="Previous page">‹</button>
  <div class="page-wrap">
    <img id="page" src="" alt="Book page" />
  </div>
  <button class="nav-btn" id="next" aria-label="Next page">›</button>
</div>

<footer>
  <div class="counter"><span id="cur">1</span> / <span id="total">1</span></div>
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="hint">Use the arrows, your keyboard ← →, or swipe to turn pages</div>
  <div class="hint" style="margin-top:0.5rem;">An unofficial fan tribute, offered free — Buc-ee's, let's partner! 🦫</div>
</footer>

<script src="pages_data.js"></script>
<script>
  let i=0;
  const img=document.getElementById('page');
  const cur=document.getElementById('cur');
  const tot=document.getElementById('total');
  const bar=document.getElementById('bar');
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');
  const wrap=document.querySelector('.page-wrap');
  tot.textContent=PAGES.length;

  function render(){
    wrap.style.opacity=0;
    setTimeout(()=>{
      img.src=PAGES[i];
      cur.textContent=i+1;
      bar.style.width=((i+1)/PAGES.length*100)+'%';
      prev.disabled=(i===0);
      next.disabled=(i===PAGES.length-1);
      wrap.style.opacity=1;
    },120);
  }
  function go(d){
    const n=i+d;
    if(n>=0&&n<PAGES.length){i=n;render();}
  }
  prev.onclick=()=>go(-1);
  next.onclick=()=>go(1);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')go(-1);
    if(e.key==='ArrowRight')go(1);
  });
  // swipe
  let sx=0;
  document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>50)go(dx<0?1:-1);
  },{passive:true});
  // preload neighbors
  img.onload=()=>{
    [i+1,i-1].forEach(n=>{if(n>=0&&n<PAGES.length){const p=new Image();p.src=PAGES[n];}});
  };
  render();
</script>
</body>
</html>
